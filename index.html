<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta

    content="Are you fun for no reason, with no benz and no fishes? Come to Farrari Harley's and get bouncy."
  />

  <!-- Open Graph / Facebook -->

  <meta property="og:site_name" content="Ferrari Harley's Bouncy Carts" />
  <meta property="og:title" content="Ferrari Harley's Bouncy Carts" />
  <meta
    property="og:description"
    content="Good vibes. Party energy. Whimsical fun. Press the buttons and unleash good energy."
  />
  <meta
    property="og:url"
    content="https://arianmalayery-studio.github.io/wild-wally/"
  />
  <meta
    property="og:image"
    content="https://arianmalayery-studio.github.io/wild-wally/images/social-preview.jpg"
  />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta
    name="twitter:title"
    content="Ferrari Harley's Bouncy Carts"
  />
  <meta
    name="twitter:description"
    content="Good vibes. Party energy. Whimsical fun."
  />
  <meta
    name="twitter:image"
    content="https://arianmalayery-studio.github.io/wild-wally/images/social-preview.jpg"
  />
  <link rel="icon" type="jpeg" href="./images/moneydog.jpg">
  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 35%, #a1c4fd 75%, #c2e9fb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .whimsy-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 1.5rem;
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }

    .wally-photo {
      max-height: 380px;
      width: 100%;
      object-fit: cover;
    }

    .whimsy-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      font-weight: 600;
      border-radius: 50rem;
      padding: 0.85rem 1.5rem;
    }

    .whimsy-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .whimsy-btn:active {
      transform: scale(0.96);
    }

    /* Floating check mark + smiley animation */
    .floating-reward {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
      animation: floatUpAndFade 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      user-select: none;
    }

    @keyframes floatUpAndFade {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(0.5) rotate(-8deg);
      }
      15% {
        opacity: 1;
        transform: translate(-50%, -25px) scale(1.2) rotate(6deg);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -95px) scale(1.05) rotate(-4deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -190px) scale(1.3) rotate(8deg);
      }
    }
  </style>
</head>
<body class="p-3 py-4">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card whimsy-card p-4 p-md-5 text-center">
          <div class="card-body">
            <span class="badge rounded-pill text-bg-warning mb-3 px-3 py-2 fs-6 shadow-sm">
              ✨ Welcome to Wild Wally's ✨
            </span>

            <h1 class="display-6 fw-bold text-dark mb-4 lh-base">
              Are you fun for no reason, with no benz and no fishes? Come to Faerrari Harley's and get bouncy..
            </h1>

            <!-- Party image placed directly under the heading -->
            <div class="mb-4">
              <img
                src="./images/wild-wally.png"
                alt="Man in a hat and flower lei shaking maracas at a Ferrari Harley's party with a golden retriever and a goat in party hats and a robot"
                class="img-fluid rounded-4 shadow border border-3 border-white wally-photo"
              />
            </div>

            <p class="text-muted mb-4">
              Press any button below to unleash good energy:
            </p>

            <div class="d-grid gap-3 col-12 col-sm-10 col-md-8 mx-auto">
              <button
                type="button"
                class="btn btn-primary btn-lg whimsy-btn"
                data-sound="dreams"
              >
                🌟 Make my dreams come true
              </button>

              <button
                type="button"
                class="btn btn-success btn-lg whimsy-btn"
                data-sound="vibes"
              >
                🌈 Make good vibes frequently
              </button>

              <button
                type="button"
                class="btn btn-danger btn-lg whimsy-btn"
                data-sound="party"
              >
                🎉 Press to Party
              </button>

              <button
                type="button"
                class="btn btn-info text-white btn-lg whimsy-btn"
                data-sound="rhythm"
              >
                🎵 Cleanse the Spirt, Love with Rhythm
              </button>

              <button
                type="button"
                class="btn btn-warning btn-lg whimsy-btn"
                data-sound="good"
              >
                💛 Be good
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <script>
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playCoolSound(type) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const presets = {
        dreams: { notes: [523.25, 659.25, 783.99, 1046.5], wave: "sine", step: 0.07 },
        vibes:  { notes: [440, 554.37, 659.25, 880], wave: "triangle", step: 0.08 },
        party:  { notes: [587.33, 739.99, 880, 1174.66, 1479.98], wave: "sawtooth", step: 0.055 },
        rhythm: { notes: [392, 493.88, 587.33, 783.99], wave: "triangle", step: 0.09 },
        good:   { notes: [523.25, 659.25, 1046.5], wave: "sine", step: 0.08 }
      };

      const preset = presets[type] || presets.dreams;

      preset.notes.forEach((freq, index) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = preset.wave;
        const startTime = now + index * preset.step;
        const duration = 0.28;

        osc.frequency.setValueAtTime(freq, startTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.03, startTime + duration);

        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(preset.wave === "sawtooth" ? 0.08 : 0.14, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      });
    }

    function spawnFloatingReward(button) {
      const rect = button.getBoundingClientRect();
      const el = document.createElement("div");
      el.className = "floating-reward";

      const randomOffsetX = (Math.random() - 0.5) * 60;
      const startX = rect.left + rect.width / 2 + randomOffsetX;
      const startY = rect.top + 8;

      el.style.left = `${startX}px`;
      el.style.top = `${startY}px`;
      el.innerHTML = `<span>✅</span><span>😊</span><span>✅</span>`;

      document.body.appendChild(el);

      el.addEventListener("animationend", () => {
        el.remove();
      });
    }

    document.querySelectorAll(".whimsy-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const soundType = btn.getAttribute("data-sound");
        spawnFloatingReward(btn);
        playCoolSound(soundType);
      });
    });
  </script>
</body>
</html>
